name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: web + headset/control apks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/settings.gradle.kts
            android/build.gradle.kts
            android/protocol/build.gradle.kts
            android/headset/build.gradle.kts
            android/control/build.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Build standalone page
        run: npm run standalone

      - name: Provision Android SDK 36
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::ANDROID_SDK_ROOT / ANDROID_HOME 未设置，无法定位 Android SDK"
            exit 1
          fi
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          [ -x "$SDKMANAGER" ] || { echo "::error::找不到 sdkmanager"; exit 1; }
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"
          {
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_HOME=$SDK_ROOT"
          } >> "$GITHUB_ENV"

      - name: Build Android APKs
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew :protocol:build :headset:assembleDebug :control:assembleDebug --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/apk"
          mkdir -p "$OUT"
          cp android/headset/build/outputs/apk/debug/headset-debug.apk "$OUT/"
          cp android/control/build/outputs/apk/debug/control-debug.apk "$OUT/"
          ( cd "$OUT" && sha256sum ./*.apk > SHA256SUMS.txt )
          cat "$OUT/SHA256SUMS.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: quiet-shore-apk
          path: ${{ runner.temp }}/apk
          if-no-files-found: error
          retention-days: 30
