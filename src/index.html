<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>静岸 · Quiet Shore VR</title>
<!-- APP_CSS -->
</head>
<body>
  <main id="start" class="start">
    <header class="brand">
      <p class="brand-en">Quiet Shore VR</p>
      <h1>静岸</h1>
      <p id="status" class="status" role="status">检测中…</p>
    </header>

    <p id="launch-scene" class="launch-scene"></p>
    <p id="launch-note" class="launch-note"></p>
    <button id="switch-scene" class="switch-scene" type="button">切换场景</button>

    <section id="scene-picker" class="scene-picker" aria-labelledby="scene-picker-title">
      <div class="section-head">
        <h2 id="scene-picker-title">场景</h2>
      </div>
      <div id="scene-list" class="scene-list" role="group" aria-labelledby="scene-picker-title"></div>
      <p id="scene-note" class="scene-note" aria-live="polite"></p>
    </section>

    <label class="perf-toggle"><input id="perf" type="checkbox"> 显示性能面板</label>

    <div class="actions">
      <button id="enter" class="primary" disabled>进入训练</button>
      <button id="preview" class="secondary">2D 预览</button>
    </div>
  </main>

  <div id="stage" class="stage" hidden></div>

  <div id="toolbar" class="toolbar" hidden>
    <button id="audio">声音: 开</button>
    <button id="recalibrate">重新校准</button>
    <button id="exit">退出</button>
  </div>

  <!-- APP_JS -->
</body>
</html>
