<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>静岸 Quiet Shore VR</title>
<!-- APP_CSS -->
</head>
<body>
  <main id="start" class="start">
    <header class="brand">
      <div class="brand-row">
        <div>
          <p class="brand-en">Quiet Shore VR</p>
          <h1>静岸</h1>
        </div>
        <span class="mode-chip">
          <span class="mode-standalone">独立使用</span>
          <span class="mode-guided">平板控制</span>
        </span>
      </div>
      <p id="status" class="status" role="status">检测中…</p>
    </header>

    <p id="launch-scene" class="launch-scene"></p>

    <div class="start-grid">
      <section id="scene-picker" class="scene-picker" aria-labelledby="scene-picker-title">
        <div class="section-head">
          <h2 id="scene-picker-title">选择场景</h2>
          <span class="section-hint">注视并确认</span>
        </div>
        <div id="scene-list" class="scene-list" role="group" aria-labelledby="scene-picker-title"></div>
        <p id="scene-note" class="scene-note" aria-live="polite"></p>
      </section>

      <aside id="scene-preview" class="scene-preview" data-scene="landscape" aria-hidden="true">
        <span id="preview-index" class="preview-index">01</span>
        <div class="preview-art"></div>
        <div class="preview-copy">
          <p id="preview-name" class="preview-name"></p>
          <p id="preview-desc" class="preview-desc"></p>
        </div>
      </aside>
    </div>

    <div class="actions">
      <button id="enter" class="primary" aria-describedby="enter-hint" disabled>开始训练</button>
      <button id="preview" class="secondary">2D 预览</button>
    </div>

    <p id="enter-hint" class="enter-hint">请看向按钮，将准星对准按钮后按下 VR 右侧中间的按钮</p>

    <p id="launch-note" class="launch-note"></p>
    <label class="perf-toggle"><input id="perf" type="checkbox"> 测试员：显示性能面板</label>
  </main>

  <div id="stage" class="stage" hidden></div>

  <div id="toolbar" class="toolbar" hidden>
    <button id="audio">声音: 开</button>
    <button id="recalibrate">重新校准</button>
    <button id="exit">退出</button>
  </div>

  <!-- APP_JS -->
</body>
</html>
