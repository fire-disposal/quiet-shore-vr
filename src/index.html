<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1211">
  <title>静岸 Quiet Shore VR</title>
  <!-- APP_CSS -->
</head>
<body>
  <main id="start" class="start">
    <header class="entry-head">
      <p class="entry-scene">
        <span>即将进入</span>
        <strong id="launch-scene"></strong>
      </p>
    </header>

    <section class="entry-core" aria-label="进入训练">
      <button id="enter" class="enter-target" type="button" disabled>
        <span id="enter-label" class="target-label">按一下头显右侧的按钮</span>
        <span class="target-sub">准备好就开始，请保持舒适姿势</span>
        <span id="controller-guide" class="controller-guide" aria-hidden="true">
          <span class="controller-outline">
            <span class="controller-round controller-top"></span>
            <span class="controller-pill"><i></i></span>
            <span class="controller-round controller-bottom"></span>
          </span>
        </span>
      </button>
      <p id="status" class="status" role="status" data-tone="neutral">
        <span id="status-text">正在检测设备…</span>
      </p>
    </section>

    <p class="entry-note">若您感到不适，请立即告知工作人员</p>
  </main>

  <div id="stage" class="stage" hidden></div>

  <!-- QS_BOOTSTRAP -->
  <!-- APP_JS -->
</body>
</html>
